name: CI/CD Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      # The fold job below pushes CHANGELOG.md and the emptied changelog.d/ back
      # to main. Both are ignored here, so that push can't re-trigger this
      # workflow and mint a second tag for a release that already happened.
      - 'changelog.d/**'
      - 'docs/**'
      - 'scripts/**'
      - '.claude/**'
      - 'deploy/**'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        uses: paulhatch/semantic-version@v6.0.3
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version_tag }}
          git push origin ${{ steps.version.outputs.version_tag }}

  # Attaches the version to the changelog entries the merged PRs wrote. A PR
  # writes its entry into changelog.d/<branch>.md with no version in it — the tag
  # doesn't exist yet — and this folds the pending fragments into CHANGELOG.md
  # under the tag just minted above, then deletes them. Never named `changelog`:
  # that is one of main's three required status checks, and a same-named job in a
  # second workflow reports against the same context.
  fold-changelog:
    needs: tag
    runs-on: ubuntu-latest
    # Two releases folding at once would race for the same file and the same
    # push. Queue them instead — never cancel, or an entry is silently dropped.
    concurrency:
      group: fold-changelog
      cancel-in-progress: false
    steps:
      # The fold commits to main, which is protected: GITHUB_TOKEN is not an
      # admin and its push would be rejected. The Renovate GitHub App is already
      # installed for exactly this reason and can bypass it.
      - name: Check the app credentials are configured
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::RENOVATE_APP_ID / RENOVATE_APP_PRIVATE_KEY are not both set — see README, Dependency updates."
            exit 1
          fi

      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # Full history and tags: a fragment's release is resolved by finding the
      # commit that added it and the earliest tag containing that commit.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fold pending fragments
        id: fold
        run: node scripts/changelog-fold.js

      - name: Commit and push
        if: steps.fold.outputs.folded == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add CHANGELOG.md changelog.d
          git commit -m "docs(changelog): fold entries into ${{ steps.fold.outputs.versions }}"
          # Another merge can land between the checkout and the push. Rebase onto
          # it and retry rather than lose the fold to a non-fast-forward.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto main."
            git pull --rebase origin main
          done
          echo "::error::Could not push the folded changelog after 3 attempts."
          exit 1

  build-and-push:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io needs a lowercase repository path; GITHUB_REPOSITORY is not.
      - name: Prepare Repository Name and Metadata
        id: meta
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.tag.outputs.new_tag }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
