name: Dependabot Changelog

# Dependabot opens the weekly dependency PRs but doesn't write CHANGELOG.md, and
# this repo wants an entry on every PR (CLAUDE.md). This job adds one to the PR
# branch so the weekly update arrives complete rather than needing a hand edit.
#
# `pull_request` (not `pull_request_target`) is deliberate: Dependabot-triggered
# runs get a read-only token by default, but the `permissions` key below raises it,
# so there's no need for the base-context trigger and its checkout-the-PR-code risk.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  # Not named `changelog`: that context is the required status check from
  # pr-checks.yml, and two jobs reporting the same name would make which one
  # main's protection is actually gating on ambiguous.
  write-entry:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Full history: the entry's version is predicted from the base branch's
          # newest heading, which means reading CHANGELOG.md as of origin/main.
          fetch-depth: 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Branch and dependency names reach this job from the manifests Dependabot
      # read, so they go through env rather than ${{ }} interpolation into the shell.
      - name: Write the changelog entry
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:CHANGELOG.md" > "${RUNNER_TEMP}/base-changelog.md"
          node scripts/dependabot-changelog.js "${RUNNER_TEMP}/base-changelog.md"

      - name: Check it still renders
        run: node scripts/build-changelog.js

      - name: Commit to the PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date for this PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): record dependency update" -- CHANGELOG.md
          git push origin "HEAD:${HEAD_REF}"
