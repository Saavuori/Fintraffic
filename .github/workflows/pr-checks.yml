name: PR Checks

# Gate merges to main: the app must compile (backend + frontend),
# tests must pass, and the changelog must render without a placeholder.
on:
  pull_request:
    branches: ["main"]

# No paths-ignore here on purpose: a required status check must always
# report a result, otherwise doc-only PRs stay "pending" forever and block merge.

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # CGO_ENABLED=0 is load-bearing: the meri SQLite driver is pure Go.
      - name: Build
        working-directory: backend
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        working-directory: backend
        run: CGO_ENABLED=0 go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      # `npm run build` runs `tsc -b && vite build` — this is what proves the app compiles.
      - name: Build
        working-directory: frontend
        run: npm run build

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject [Unreleased] placeholder
        run: |
          if grep -q '\[Unreleased\]' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md must use a real versioned heading (## [vX.Y.Z] - date), not [Unreleased]."
            exit 1
          fi

      - name: Render changelog
        run: node scripts/build-changelog.js
