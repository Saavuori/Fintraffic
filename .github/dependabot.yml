# Dependabot keeps the four places this repo pins versions up to date:
# the Go module, the frontend npm tree, the GitHub Actions used by CI, and the
# container base images (Dockerfile build/runtime stages + the deploy stack).
#
# Grouping is deliberate: minor/patch bumps arrive as one PR per ecosystem so a
# routine week is a single review, while majors come one-per-PR because they're
# the ones that need a real look (MapLibre 5 → 6 in v0.10.3 is the example).
#
# Note for reviewers: Dependabot doesn't write CHANGELOG.md, and the PR-checks
# changelog job only rejects the [Unreleased] placeholder — it won't fail an
# entry-less PR. Add the changelog entry to the Dependabot branch before merging,
# same as any other PR (see CLAUDE.md).
version: 2

updates:
  # Go backend
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # React/Vite frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # CI workflow actions (.github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfile build + runtime stages (node, golang, alpine)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    groups:
      base-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Deploy stack images (redis)
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    ignore:
      # Our own image, pinned to :latest by design — update.sh pulls it.
      - dependency-name: ghcr.io/saavuori/fintraffic
